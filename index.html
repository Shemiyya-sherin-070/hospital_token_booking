<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Doctor Token Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hospital-header">
        <div class="container">
            <h1>City Care Hospital</h1>
            <p>Doctor Consultation Token Booking</p>
        </div>
    </header>
    <main class="container">
        <div class="card booking-card">
            <div class="card-header text-center">
                Book Doctor Token
            </div>
            <div class="card-body">
                <form id="bookingForm">
                    <div class="mb-3">
                        <label for="patientName" class="form-label">
                            Patient Name
                        </label>
                        <input type="text" id="patientName" class="form-control" placeholder="Enter patient name" required>
                    </div>
                    <div class="mb-3">
                        <label for="doctor" class="form-label">
                            Select Doctor
                        </label>
                        <select id="doctor" class="form-select" required>
                            <option value=""> Select Doctor </option>
                            <option value="Dr. Anil Kumar"> Dr. Anil Kumar - Cardiology </option>
                            <option value="Dr. Priya Menon"> Dr. Priya Menon - Pediatrics </option>
                            <option value="Dr. Rahul Nair"> Dr. Rahul Nair - General Medicine </option>
                        </select>
                    </div>
                
                    <div class="mb-4">
                        <label for="slot" class="form-label">
                            Available Consultation Slot
                        </label>
                        <select id="slot" class="form-select" required>
                            <option value=""> Select Slot </option>
                            <option> 09:00 AM - 11:00 AM </option>
                            <option> 11:00 AM - 01:00 PM </option>
                            <option> 02:00 PM - 04:00 PM </option>
                            <option> 04:00 PM - 06:00 PM </option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-book w-100"> Generate Token </button>
                </form>
                <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
            </div>
        </div>

        <div class="token-container">
            <div class="alert current-token">
                <h5>Current Token</h5>
                <div id="currentToken" class="token-number">
                    --
                </div>
                <p>
                    Patients currently being served
                </p>
            </div>

            <div id="patientTokenCard" class="alert patient-token d-none">
                <h5>Your Token</h5>
                <div id="patientToken" class="token-number"></div>
                <p>
                    <strong>Patient:</strong>
                    <span id="displayPatient"></span>
                </p>
                <p>
                    <strong>Doctor:</strong>
                    <span id="displayDoctor"></span>
                </p>
                <p>
                    <strong>Slot:</strong>
                    <span id="displaySlot"></span>
                </p>
            </div>
        </div>
    </main>
    <footer>
        © 2026 City Care Hospital |
        Doctor Token Management System
    </footer>
    <script src="script.js"></script>
</body>
</html>
